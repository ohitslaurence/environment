# Terminal settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g xterm-keys on

# Change prefix to Ctrl-a (easier than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Vi mode for copy
setw -g mode-keys vi

# Remove escape delay (important for vim/neovim)
set -sg escape-time 0

# Increase history limit
set -g history-limit 50000

# Focus events for neovim
set -g focus-events on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane resizing with Ctrl + vim keys
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Status bar
set -g status-position bottom
set -g status-style 'bg=colour234 fg=colour250'
set -g status-left-length 40
set -g status-left '#[fg=colour46,bold] #S #[fg=colour250]│ '
set -g status-right '#[fg=colour250]│ #[fg=colour214]%H:%M #[fg=colour250]│ #[fg=colour81]%d %b '
set -g status-right-length 50

# Window status
setw -g window-status-current-style 'fg=colour81 bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=colour250'
setw -g window-status-format ' #I:#W#F '

# Pane borders
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour81'

# Message style
set -g message-style 'bg=colour234 fg=colour214 bold'

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Default shell
set -g default-shell /bin/zsh

# Pass through for terminal features
set -g allow-passthrough on

# Clipboard (works with OSC 52)
set -g set-clipboard on

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'
